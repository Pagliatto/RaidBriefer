# 새 버전을 올리면 디스코드 공지 채널에 '바뀐 점' 카드를 보낸다.
# 손으로 실행(Run workflow)하면 시험용 웹훅(관리자 채널)으로만 보낸다.
name: Discord release notice

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to preview (e.g. v1.3.0). Sent to the test webhook only."
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Send card to Discord
        env:
          # 어느 쪽으로 보낼지는 스크립트가 GITHUB_EVENT_NAME 으로 고름 (빈 주소면 다른 쪽으로 넘어가지 않고 실패)
          WEBHOOK_NOTICE: ${{ secrets.DISCORD_WEBHOOK_NOTICE }}
          WEBHOOK_TEST: ${{ secrets.DISCORD_WEBHOOK_TEST }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: python3 .github/scripts/discord_release.py
