# PR 을 열거나 main 에 들어갈 때 자동으로 도는 검사.
# 사용자 PC 와 같은 Windows 에서, 캐시·로그·user_data 없이 (깨끗한 복사본) 돌린다.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Forbidden files
        env:
          PRIVATE_PATHS: ${{ secrets.PRIVATE_PATHS }}
        run: python .github/scripts/forbidden_files.py

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: python -m compileall -q app tools RaidBriefer.py

      - name: JavaScript syntax
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem app/static -Filter *.js -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Screen text dictionaries (i18n)
        run: python tools/i18n_check.py

      - name: Guide data
        run: python tools/data_check.py --guides-only

      # tarkov.dev 에서 맵 목록을 받아 오므로 인터넷이 잠깐 끊기면 실패할 수 있음 → 30초 뒤 최대 3번
      - name: Story data
        shell: pwsh
        run: |
          for ($try = 1; $try -le 3; $try++) {
            python tools/story_check.py
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($try -lt 3) { Write-Host "retry $try/3 in 30s"; Start-Sleep -Seconds 30 }
          }
          exit 1

      - name: Story English
        run: python tools/story_en_check.py
